name: Update the directory

on:
  schedule:
    - cron: '17 * * * *'   # every hour: add new submissions
    - cron: '43 3 * * *'   # every day: recheck every catalogue and merge peers' lists
  workflow_dispatch:
    inputs:
      mode:
        description: 'new (submissions only) or full (recheck everything)'
        default: full

permissions:
  contents: write

concurrency:
  group: directory
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check catalogues
        run: node scripts/check.mjs ${{ (github.event.schedule == '43 3 * * *' || inputs.mode == 'full') && 'full' || 'new' }}
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
      - name: Save the list
        run: |
          if [ -n "$(git status --porcelain directory.json)" ]; then
            git config user.name "directory-bot"
            git config user.email "directory-bot@users.noreply.github.com"
            git add directory.json
            git commit -m "Update directory ($(jq .count directory.json) catalogues)"
            git push
          fi
